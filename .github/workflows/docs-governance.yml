name: Documentation governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-governance:
    name: docs-governance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and PR base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repository tests including documentation snapshot checks
        run: pnpm test

      - name: Run diff-aware documentation freeze
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm docs:check:ci

      - name: Run diff-aware documentation freeze for main push
        if: github.event_name == 'push'
        env:
          DOCS_BASE_REF: ${{ github.event.before }}
        run: pnpm docs:check:ci
